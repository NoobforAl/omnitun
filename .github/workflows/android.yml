name: Android

# The app build pipeline. Android only for now: no Windows, macOS, Linux or iOS app is built.
# (ci.yml runs the tests; this workflow turns the code into installable APKs.)
#
# What it builds, in order (the same scripts as a local release build):
#   1. the Tor client (Rust, Arti) for every ABI        scripts/build-android-tor.sh
#   2. the Go core as an Android library (gomobile)     scripts/build-android-core.sh
#   3. the Flutter app, one release APK per ABI         flutter build apk --split-per-abi
#
# Signing: without secrets the APKs are signed with the debug key (fine to try, cannot update an
# installed release build). To sign for real, add these repository secrets:
#   ANDROID_KEYSTORE_BASE64    the keystore file, base64 (base64 -w0 omnitun-release.jks)
#   ANDROID_KEYSTORE_PASSWORD  its store password
#   ANDROID_KEY_PASSWORD       the key password (alias: omnitun)
# Third-party actions are pinned to full commit SHAs (a moved tag cannot run new code with the
# signing secrets); Dependabot (.github/dependabot.yml) proposes updates.
# Keep the keystore backed up: updates to an installed app must be signed with the same key.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "tor/**"
      - "third_party/**"
      - "go.mod"
      - "go.sum"
      - "scripts/build-android-*.sh"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "core/**"
      - "tor/**"
      - "third_party/**"
      - "go.mod"
      - "go.sum"
      - "scripts/build-android-*.sh"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-17)
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tor

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-ndk

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      # The Android SDK and NDK come with the runner image (ANDROID_HOME, ANDROID_NDK_HOME).
      - name: Tor client (all ABIs)
        run: bash scripts/build-android-tor.sh arm64-v8a armeabi-v7a x86_64

      - name: Go core (gomobile)
        run: bash scripts/build-android-core.sh

      - name: Release signing (only when the secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/android/omnitun-release.jks
            printf 'storeFile=omnitun-release.jks\nstorePassword=%s\nkeyAlias=omnitun\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" > app/android/key.properties
            echo "signing: release key"
          else
            echo "signing: debug key (no secrets)"
          fi

      - name: App (one APK per ABI)
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Checksums
        working-directory: app/build/app/outputs/flutter-apk
        run: sha256sum *-release.apk | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: omnitun-android-${{ github.sha }}
          path: |
            app/build/app/outputs/flutter-apk/*-release.apk
            app/build/app/outputs/flutter-apk/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
